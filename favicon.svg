<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .m-letter {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 340px;
      }
    </style>
  </defs>

  <!-- Background circle (cream, like the logo) -->
  <circle cx="256" cy="256" r="248" fill="#F5EFE1"/>

  <!-- Outer terracotta ring -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#C87F4C" stroke-width="6"/>

  <!-- Dotted ring, echoing the logo's dotted border -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#C87F4C" stroke-width="5" stroke-dasharray="1 13" stroke-linecap="round"/>

  <!-- The M, in the dark brown of "DA MARIA" -->
  <text x="256" y="378" text-anchor="middle" class="m-letter" fill="#3C2A1D">M</text>
</svg>
